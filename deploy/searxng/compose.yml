name: dsh-web-search-multi

services:
  searxng:
    image: ghcr.io/searxng/searxng:2026.8.20-8d3dd0cd4
    restart: unless-stopped
    ports:
      - 127.0.0.1:8080:8080
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=5)"]
      interval: 30s
      timeout: 6s
      retries: 5
      start_period: 20s
